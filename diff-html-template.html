<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root{
    --ground:#f4f5f7;
    --card:#ffffff;
    --ink:#1b1f27;
    --ink-dim:#5b6472;
    --line:#dde1e7;
    --accent:#3a6ff7;
    --ins-bg:#d9f2df;
    --ins-ink:#1a7431;
    --ins-line:#8fd6a4;
    --del-bg:#fbdfe0;
    --del-ink:#b0272d;
    --del-line:#f0a3a6;
    --chip-a:#6d5bd0;
    --chip-b:#1f8a70;
    --chip-diff:#b8590f;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ground:#14161b;
      --card:#1c1f26;
      --ink:#e9ebef;
      --ink-dim:#9aa2b1;
      --line:#2c313b;
      --accent:#6d94ff;
      --ins-bg:#123522;
      --ins-ink:#7be3a0;
      --ins-line:#1f5c39;
      --del-bg:#3a1518;
      --del-ink:#ff9ba0;
      --del-line:#6e2328;
      --chip-a:#a698f2;
      --chip-b:#5fd1b3;
      --chip-diff:#f2a563;
    }
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ground);
    color:var(--ink);
    font-family:system-ui, -apple-system, 'Hiragino Sans', 'Yu Gothic', sans-serif;
    padding-inline:16px;
  }
  .app{display:flex;flex-direction:column;height:100%;max-width:1400px;margin:0 auto;}

  header{
    flex:0 0 auto;
    padding-block:14px 10px;
    display:flex;
    flex-wrap:wrap;
    align-items:baseline;
    gap:6px 16px;
    border-bottom:1px solid var(--line);
  }
  header h1{
    font-size:1.15rem;
    font-weight:700;
    margin:0;
    letter-spacing:.01em;
  }
  .path{
    font-family:ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
    font-size:.82rem;
    color:var(--ink-dim);
    overflow-wrap:anywhere;
  }
  .spacer{flex:1 1 auto;}
  .stats{
    display:flex;
    gap:8px;
    font-size:.78rem;
    font-variant-numeric:tabular-nums;
  }
  .stat{
    padding:2px 8px;
    border-radius:999px;
    border:1px solid var(--line);
    color:var(--ink-dim);
  }
  .stat.ins{border-color:var(--ins-line);color:var(--ins-ink);}
  .stat.del{border-color:var(--del-line);color:var(--del-ink);}

  .sync{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:.82rem;
    color:var(--ink-dim);
    cursor:pointer;
    user-select:none;
    padding:4px 10px 4px 4px;
    border:1px solid var(--line);
    border-radius:999px;
    background:var(--card);
  }
  .sync input{accent-color:var(--accent);}

  .panes{
    flex:1 1 auto;
    min-height:0;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    padding-block:12px;
  }
  .pane{
    display:flex;
    flex-direction:column;
    min-height:0;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }
  .pane .label{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 12px;
    font-size:.78rem;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    border-bottom:1px solid var(--line);
  }
  .pane .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
  .pane.a .dot{background:var(--chip-a);}
  .pane.b .dot{background:var(--chip-b);}
  .pane.diff .dot{background:var(--chip-diff);}
  .pane .label small{
    font-weight:500;
    text-transform:none;
    letter-spacing:0;
    color:var(--ink-dim);
  }
  .pane iframe{
    flex:1 1 auto;
    width:100%;
    border:0;
    background:#fff;
  }
  .pane.is-hidden{display:none;}

  @media (min-width:901px){
    .panes.cols-2{grid-template-columns:repeat(2,1fr);}
  }

  @media (max-width:900px){
    .panes{
      grid-template-columns:1fr;
      grid-auto-rows:60vh;
      overflow-y:auto;
    }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>__TITLE__</h1>
    <div class="path">__PATH_LABEL__</div>
    <div class="spacer"></div>
    <div class="stats" id="stats"></div>
    <label class="sync">
      <input type="checkbox" id="sync-toggle" checked>
      Sync scroll
    </label>
    <label class="sync">
      <input type="checkbox" id="hide-a-toggle">
      Hide __REVISION_LABEL__ (A)
    </label>
  </header>

  <div class="panes" id="panes">
    <div class="pane a" id="pane-a">
      <div class="label"><span class="dot"></span>A <small>&mdash; __REVISION_LABEL__</small></div>
      <iframe id="frame-a" title="A: __REVISION_LABEL__"></iframe>
    </div>
    <div class="pane b">
      <div class="label"><span class="dot"></span>B <small>&mdash; Working copy</small></div>
      <iframe id="frame-b" title="B: working copy"></iframe>
    </div>
    <div class="pane diff">
      <div class="label"><span class="dot"></span>Diff <small>&mdash; A&rarr;B, insert=green / delete=red</small></div>
      <iframe id="frame-diff" title="Diff"></iframe>
    </div>
  </div>
</div>

<script type="text/plain" id="data-old-b64">__OLD_B64__</script>
<script type="text/plain" id="data-new-b64">__NEW_B64__</script>

<script>
(function(){
  'use strict';

  function decodeB64Utf8(b64){
    const bin = atob(b64);
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    return new TextDecoder('utf-8').decode(bytes);
  }

  const oldHtml = decodeB64Utf8(document.getElementById('data-old-b64').textContent.trim());
  const newHtml = decodeB64Utf8(document.getElementById('data-new-b64').textContent.trim());

  // トークナイザ + Myers diff (html タグ/空白/CJK1文字/英数語 単位)
  const TOKEN_RE = /<[^>]*>|\s+|[　-〿぀-ヿ㐀-䶿一-鿿＀-￯]|[A-Za-z0-9_'-]+|./gs;
  function tokenize(html){ return html.match(TOKEN_RE) || []; }

  function diffTokens(a, b){
    const n = a.length, m = b.length, max = n + m;
    const v = new Map(); v.set(1, 0);
    const trace = [];
    let foundD = -1;
    outer:
    for (let d = 0; d <= max; d++){
      trace.push(new Map(v));
      for (let k = -d; k <= d; k += 2){
        let x;
        if (k === -d || (k !== d && v.get(k - 1) < v.get(k + 1))) x = v.get(k + 1);
        else x = v.get(k - 1) + 1;
        let y = x - k;
        while (x < n && y < m && a[x] === b[y]) { x++; y++; }
        v.set(k, x);
        if (x >= n && y >= m){ foundD = d; break outer; }
      }
    }
    const ops = [];
    let x = n, y = m;
    for (let d = foundD; d > 0; d--){
      const v = trace[d];
      const k = x - y;
      let prevK;
      if (k === -d || (k !== d && v.get(k - 1) < v.get(k + 1))) prevK = k + 1;
      else prevK = k - 1;
      const prevX = v.get(prevK);
      const prevY = prevX - prevK;
      while (x > prevX && y > prevY){ ops.push({type:'equal', old:x-1, new:y-1}); x--; y--; }
      if (x === prevX){ ops.push({type:'insert', new:y-1}); y--; }
      else { ops.push({type:'delete', old:x-1}); x--; }
    }
    while (x > 0 && y > 0){ ops.push({type:'equal', old:x-1, new:y-1}); x--; y--; }
    ops.reverse();
    return ops.map(op => ({ type: op.type, token: op.type === 'insert' ? b[op.new] : a[op.old] }));
  }

  function renderDiffHtml(ops){
    let out = '';
    let openType = null;
    const close = () => {
      if (openType === 'insert') out += '</ins>';
      else if (openType === 'delete') out += '</del>';
      openType = null;
    };
    for (const op of ops){
      const isTag = op.token.startsWith('<') && op.token.endsWith('>');
      if (isTag){ close(); out += op.token; continue; }
      if (op.type === 'equal'){ close(); out += op.token; continue; }
      if (openType !== op.type){
        close();
        out += op.type === 'insert' ? '<ins class="hd-ins">' : '<del class="hd-del">';
        openType = op.type;
      }
      out += op.token;
    }
    close();
    return out;
  }

  const oldTokens = tokenize(oldHtml);
  const newTokens = tokenize(newHtml);
  const ops = diffTokens(oldTokens, newTokens);

  const insCount = ops.filter(o => o.type === 'insert').length;
  const delCount = ops.filter(o => o.type === 'delete').length;
  document.getElementById('stats').innerHTML =
    '<span class="stat">' + oldTokens.length + ' &rarr; ' + newTokens.length + ' tokens</span>' +
    '<span class="stat ins">+' + insCount + '</span>' +
    '<span class="stat del">&minus;' + delCount + '</span>';

  const diffBody = renderDiffHtml(ops);
  const diffStyle =
    '<style>ins.hd-ins{background:#d9f2df;color:#1a7431;text-decoration:none;border-radius:2px;box-shadow:0 0 0 1px #8fd6a4;}' +
    'del.hd-del{background:#fbdfe0;color:#b0272d;border-radius:2px;box-shadow:0 0 0 1px #f0a3a6;}' +
    '@media (prefers-color-scheme: dark){' +
    'ins.hd-ins{background:#123522;color:#7be3a0;box-shadow:0 0 0 1px #1f5c39;}' +
    'del.hd-del{background:#3a1518;color:#ff9ba0;box-shadow:0 0 0 1px #6e2328;}' +
    '}</style>';
  const diffHtml = diffBody.includes('</head>')
    ? diffBody.replace('</head>', diffStyle + '</head>')
    : diffStyle + diffBody;

  const frameA = document.getElementById('frame-a');
  const frameB = document.getElementById('frame-b');
  const frameDiff = document.getElementById('frame-diff');
  frameA.srcdoc = oldHtml;
  frameB.srcdoc = newHtml;
  frameDiff.srcdoc = diffHtml;

  // scroll-all-mode 風の同期スクロール(%ベース)
  const frames = [frameA, frameB, frameDiff];
  let suppress = false;
  const syncToggle = document.getElementById('sync-toggle');

  function scrollFraction(win){
    const doc = win.document.scrollingElement || win.document.documentElement;
    const max = doc.scrollHeight - win.innerHeight;
    return max > 0 ? doc.scrollTop / max : 0;
  }
  function applyFraction(win, frac){
    const doc = win.document.scrollingElement || win.document.documentElement;
    const max = doc.scrollHeight - win.innerHeight;
    doc.scrollTop = frac * max;
  }
  function wire(frame){
    frame.addEventListener('load', () => {
      try {
        frame.contentWindow.addEventListener('scroll', () => {
          if (!syncToggle.checked || suppress) return;
          suppress = true;
          const frac = scrollFraction(frame.contentWindow);
          for (const f of frames){
            if (f !== frame) applyFraction(f.contentWindow, frac);
          }
          requestAnimationFrame(() => { suppress = false; });
        }, { passive: true });
      } catch (e) { /* iframe not ready */ }
    });
  }
  frames.forEach(wire);

  // A(HEAD)ペインを隠して B + Diff だけを表示するトグル
  const hideAToggle = document.getElementById('hide-a-toggle');
  const paneA = document.getElementById('pane-a');
  const panes = document.getElementById('panes');
  hideAToggle.addEventListener('change', () => {
    paneA.classList.toggle('is-hidden', hideAToggle.checked);
    panes.classList.toggle('cols-2', hideAToggle.checked);
  });
})();
</script>
</body>
</html>
